<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HMC">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23ffffff' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='black' text-anchor='middle' dominant-baseline='middle'>₺</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23ffffff' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='90' fill='black' text-anchor='middle' dominant-baseline='middle'>₺</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>HMC</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1a1a1a;
            --text: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --danger: #ff4444;
            --success: #ffdd00;
            --border: #333333;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { width: 100%; height: 100%; -webkit-user-select: none; user-select: none; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            padding: 12px; 
            padding-top: max(12px, var(--safe-top));
            padding-bottom: max(12px, var(--safe-bottom));
            max-width: 500px; 
            margin: 0 auto; 
            overflow-y: auto;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); letter-spacing: 2px; }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dash-card {
            background: var(--card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            word-break: break-word;
        }

        .dash-card.full { 
            grid-column: span 2; 
            background: #222222;
            border: 2px solid var(--accent);
        }
        .dash-card label { font-size: 0.65rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .dash-card .value { font-size: 1.2rem; font-weight: 700; }
        .dash-card.full .value { font-size: 1.5rem; }

        .section-title { 
            font-size: 0.75rem; 
            font-weight: 700; 
            margin: 12px 0 6px 0; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .form-group {
            background: var(--card);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .form-group label { font-size: 0.85rem; min-width: 30%; font-weight: 600; }
        .form-group input {
            flex: 1;
            min-width: 100px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 6px;
            text-align: right;
            font-size: 1rem;
        }

        .dynamic-row { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 8px;
            background: var(--card);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        .dynamic-row.expense {
            border-left: 3px solid var(--danger);
        }

        .dynamic-row.income {
            border-left: 3px solid var(--success);
        }

        .dynamic-row input[type="text"] { 
            flex: 1;
            min-width: 80px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .dynamic-row input[type="number"] { 
            width: 70px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            text-align: right;
            font-size: 0.9rem;
        }

        .btn-del { 
            background: var(--danger); 
            border: none; 
            color: white; 
            border-radius: 6px; 
            padding: 6px 8px; 
            font-weight: bold; 
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .btn-add {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 8px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.9rem;
        }

        .install-banner {
            background: #222222;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 0.8rem;
            display: none;
            border: 1px solid var(--border);
        }
        .install-banner.show { display: block; }
    </style>
</head>
<body>

    <div class="install-banner" id="install-banner">
        📱 Ana ekrana ekle: Safari Paylaş → Ekle
    </div>

    <div class="header">
        <h1>HMC</h1>
    </div>

    <!-- Özet Paneli -->
    <div class="dashboard">
        <div class="dash-card full">
            <label>Günlük Limit</label>
            <div class="value" id="daily-limit">₺0,00</div>
            <small style="font-size: 0.65rem; opacity: 0.8;" id="days-left">Kalan: 0 gün</small>
        </div>
        <div class="dash-card">
            <label>Kalan (-)</label>
            <div class="value" id="net-ex-extra">₺0,00</div>
        </div>
        <div class="dash-card">
            <label>Kalan (+)</label>
            <div class="value" style="color: var(--success)" id="net-inc-extra">₺0,00</div>
        </div>
    </div>

    <!-- Sabit Bütçe Kalemleri -->
    <div class="section-title">Temel</div>
    <div class="form-group"><label>Maaş</label><input type="number" id="salary" value="" oninput="calculate()" placeholder="0"></div>
    <div class="form-group"><label>Nakit</label><input type="number" id="cash" value="" oninput="calculate()" placeholder="0"></div>
    <div class="form-group"><label>Borç</label><input type="number" id="card-debt" value="" oninput="calculate()" placeholder="0"></div>

    <!-- Sınırsız Kalemler -->
    <div class="section-title" style="color: var(--danger);">Giderler</div>
    <div id="fixed-expenses-list"></div>
    <button class="btn-add" onclick="addRow('fixed-expenses-list', 'expense')">+ Ekle</button>

    <div class="section-title" style="color: var(--danger);">Taksitler</div>
    <div id="installments-list"></div>
    <button class="btn-add" onclick="addRow('installments-list', 'expense')">+ Ekle</button>

    <div class="section-title" style="color: var(--success);">Gelirler</div>
    <div id="extra-income-list"></div>
    <button class="btn-add" onclick="addRow('extra-income-list', 'income')">+ Ekle</button>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').classList.add('show');
        });

        function getDaysUntil28th() {
            const today = new Date();
            const currentDay = today.getDate();
            let targetDate = new Date(today.getFullYear(), today.getMonth(), 28);

            if (currentDay > 28) {
                targetDate = new Date(today.getFullYear(), today.getMonth() + 1, 28);
            }

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            return diffDays > 0 ? diffDays : 1;
        }

        function addRow(containerId, type = 'expense', name = '', value = '') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `dynamic-row ${type}`;
            div.innerHTML = `
                <input type="text" placeholder="Açıkla" value="${name}" class="row-name" oninput="calculate()">
                <input type="number" placeholder="₺" value="${value}" min="0" step="0.01" class="row-val" oninput="calculate()">
                <button class="btn-del" onclick="this.parentElement.remove(); calculate();">✕</button>
            `;
            container.appendChild(div);
            calculate();
        }

        function getListTotal(containerId) {
            let total = 0;
            document.querySelectorAll(`#${containerId} .row-val`).forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            return total;
        }

        function getListData(containerId) {
            const data = [];
            document.querySelectorAll(`#${containerId} .dynamic-row`).forEach(row => {
                const name = row.querySelector('.row-name').value.trim();
                const val = row.querySelector('.row-val').value.trim();
                if (name && val) {
                    data.push({ name, val });
                }
            });
            return data;
        }

        function saveData() {
            const state = {
                salary: document.getElementById('salary').value || '',
                cash: document.getElementById('cash').value || '',
                cardDebt: document.getElementById('card-debt').value || '',
                fixedExpenses: getListData('fixed-expenses-list'),
                installments: getListData('installments-list'),
                extraIncome: getListData('extra-income-list')
            };
            localStorage.setItem('hmc_data', JSON.stringify(state));
        }

        function loadData() {
            const saved = localStorage.getItem('hmc_data');
            if (!saved) return;

            const state = JSON.parse(saved);

            document.getElementById('salary').value = state.salary || '';
            document.getElementById('cash').value = state.cash || '';
            document.getElementById('card-debt').value = state.cardDebt || '';

            if (state.fixedExpenses) {
                state.fixedExpenses.forEach(item => addRow('fixed-expenses-list', 'expense', item.name, item.val));
            }
            if (state.installments) {
                state.installments.forEach(item => addRow('installments-list', 'expense', item.name, item.val));
            }
            if (state.extraIncome) {
                state.extraIncome.forEach(item => addRow('extra-income-list', 'income', item.name, item.val));
            }
        }

        function calculate() {
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const cash = parseFloat(document.getElementById('cash').value) || 0;
            const cardDebt = parseFloat(document.getElementById('card-debt').value) || 0;

            const fixedExpenses = getListTotal('fixed-expenses-list');
            const installments = getListTotal('installments-list');
            const extraIncome = getListTotal('extra-income-list');

            const netExExtra = salary + cash - fixedExpenses - installments - cardDebt;
            const netIncExtra = netExExtra + extraIncome;

            const daysLeft = getDaysUntil28th();
            const dailyLimit = netIncExtra / daysLeft;

            document.getElementById('net-ex-extra').textContent = `₺${netExExtra.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById('net-inc-extra').textContent = `₺${netIncExtra.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById('daily-limit').textContent = `₺${dailyLimit.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById('days-left').textContent = `Kalan: ${daysLeft} gün`;

            saveData();
        }

        loadData();
        calculate();
    </script>
</body>
</html>
