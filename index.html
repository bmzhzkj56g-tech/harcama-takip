<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HMC">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23ffffff' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='black' text-anchor='middle' dominant-baseline='middle'>₺</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23ffffff' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='90' fill='black' text-anchor='middle' dominant-baseline='middle'>₺</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>HMC</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1a1a1a;
            --text: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --danger: #ff4444;
            --success: #ffdd00;
            --border: #333333;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { width: 100%; height: 100%; -webkit-user-select: none; user-select: none; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            padding: 0;
            margin: 0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            padding: 12px 12px 8px 12px;
            padding-top: max(12px, var(--safe-top));
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }

        .header h1 { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--accent); 
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .today { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
        }

        .period-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.7rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .dot.active { background: var(--accent); }

        /* HOME SCREEN */
        .home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: calc(100vh - var(--safe-top) - var(--safe-bottom));
            padding: 20px;
            gap: 20px;
            display: none;
        }

        .home-screen.active {
            display: flex;
        }

        .home-btn {
            width: 100%;
            max-width: 300px;
            padding: 40px 20px;
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 12px;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .home-btn:active {
            background: var(--accent);
            color: var(--bg);
        }

        /* MONTH SELECTOR */
        .month-selector {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - var(--safe-top) - var(--safe-bottom));
            padding: 12px;
            padding-bottom: max(12px, var(--safe-bottom));
            gap: 12px;
            display: none;
        }

        .month-selector.active {
            display: flex;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 12px;
        }

        .month-btn {
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .month-btn:active {
            background: var(--accent);
            color: var(--bg);
        }

        .back-btn {
            padding: 12px;
            background: transparent;
            border: 1px solid var(--text-muted);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.9rem;
        }

        /* CONTAINER */
        .container {
            display: flex;
            width: 100%;
            height: calc(100vh - var(--safe-top) - var(--safe-bottom));
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            display: none;
        }

        .container.active {
            display: flex;
        }

        .period {
            flex: 0 0 100%;
            width: 100%;
            overflow-y: auto;
            scroll-snap-align: start;
            padding: 12px;
            padding-bottom: max(12px, var(--safe-bottom));
        }

        .period-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dash-card {
            background: var(--card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            word-break: break-word;
        }

        .dash-card.full { 
            grid-column: span 2; 
            background: #222222;
            border: 2px solid var(--accent);
        }
        .dash-card label { font-size: 0.65rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .dash-card .value { font-size: 1.2rem; font-weight: 700; }
        .dash-card.full .value { font-size: 1.5rem; }

        .section-title { 
            font-size: 0.75rem; 
            font-weight: 700; 
            margin: 12px 0 6px 0; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .form-group {
            background: var(--card);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .form-group label { font-size: 0.85rem; min-width: 30%; font-weight: 600; }
        .form-group input {
            flex: 1;
            min-width: 100px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 6px;
            text-align: right;
            font-size: 1rem;
        }

        .dynamic-row { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 8px;
            background: var(--card);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        .dynamic-row.expense {
            border-left: 3px solid var(--danger);
        }

        .dynamic-row.income {
            border-left: 3px solid var(--success);
        }

        .dynamic-row input[type="text"] { 
            flex: 1;
            min-width: 80px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .dynamic-row input[type="number"] { 
            width: 70px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            text-align: right;
            font-size: 0.9rem;
        }

        .btn-del { 
            background: var(--danger); 
            border: none; 
            color: white; 
            border-radius: 6px; 
            padding: 6px 8px; 
            font-weight: bold; 
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .btn-add {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 8px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.9rem;
        }

        .back-home-btn {
            position: fixed;
            top: max(12px, var(--safe-top));
            left: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 20;
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body>

    <button class="back-home-btn" id="back-home-btn" onclick="goHome()" style="display: none;">← Ana</button>

    <!-- HOME SCREEN -->
    <div class="home-screen active" id="home-screen">
        <div class="header">
            <h1>HMC</h1>
            <div class="today" id="today-date">Bugün: --</div>
        </div>
        <button class="home-btn" onclick="showCurrentPeriod()">Mevcut Dönem</button>
        <button class="home-btn" onclick="showPastMonths()">Geçmiş Dönem İncele</button>
    </div>

    <!-- MONTH SELECTOR -->
    <div class="month-selector" id="month-selector">
        <div style="text-align: center; padding: 12px; border-bottom: 1px solid var(--border);">
            <h2 style="font-size: 1.1rem; margin-bottom: 4px;">Ay Seçin</h2>
        </div>
        <div class="month-grid" id="month-grid"></div>
        <button class="back-btn" onclick="goHome()">← Geri Dön</button>
    </div>

    <!-- PERIODS CONTAINER -->
    <div class="header" id="header" style="display: none;">
        <h1>HMC</h1>
        <div class="today" id="current-months">--</div>
        <div class="period-indicator">
            <div class="dot active" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
        </div>
    </div>

    <div class="container" id="container">
        <!-- Dönem 1 -->
        <div class="period" id="period-1">
            <div class="period-title" id="period-1-title">--</div>

            <div class="dashboard">
                <div class="dash-card full">
                    <label>Günlük Limit</label>
                    <div class="value" id="daily-limit-1">₺0,00</div>
                    <small style="font-size: 0.65rem; opacity: 0.8;" id="days-left-1">Kalan: 0 gün</small>
                </div>
                <div class="dash-card">
                    <label>Kalan (-)</label>
                    <div class="value" id="net-ex-extra-1">₺0,00</div>
                </div>
                <div class="dash-card">
                    <label>Kalan (+)</label>
                    <div class="value" style="color: var(--success)" id="net-inc-extra-1">₺0,00</div>
                </div>
            </div>

            <div class="section-title">Temel</div>
            <div class="form-group"><label>Maaş</label><input type="number" id="salary-1" value="" oninput="calculate(1)" placeholder="0"></div>
            <div class="form-group"><label>Nakit</label><input type="number" id="cash-1" value="" oninput="calculate(1)" placeholder="0"></div>
            <div class="form-group"><label>Borç</label><input type="number" id="card-debt-1" value="" oninput="calculate(1)" placeholder="0"></div>

            <div class="section-title" style="color: var(--danger);">Giderler</div>
            <div id="fixed-expenses-list-1"></div>
            <button class="btn-add" onclick="addRow('fixed-expenses-list-1', 'expense', 1)">+ Ekle</button>

            <div class="section-title" style="color: var(--danger);">Taksitler</div>
            <div id="installments-list-1"></div>
            <button class="btn-add" onclick="addRow('installments-list-1', 'expense', 1)">+ Ekle</button>

            <div class="section-title" style="color: var(--success);">Gelirler</div>
            <div id="extra-income-list-1"></div>
            <button class="btn-add" onclick="addRow('extra-income-list-1', 'income', 1)">+ Ekle</button>
        </div>

        <!-- Dönem 2 -->
        <div class="period" id="period-2">
            <div class="period-title" id="period-2-title">--</div>

            <div class="dashboard">
                <div class="dash-card full">
                    <label>Günlük Limit</label>
                    <div class="value" id="daily-limit-2">₺0,00</div>
                    <small style="font-size: 0.65rem; opacity: 0.8;" id="days-left-2">Kalan: 0 gün</small>
                </div>
                <div class="dash-card">
                    <label>Kalan (-)</label>
                    <div class="value" id="net-ex-extra-2">₺0,00</div>
                </div>
                <div class="dash-card">
                    <label>Kalan (+)</label>
                    <div class="value" style="color: var(--success)" id="net-inc-extra-2">₺0,00</div>
                </div>
            </div>

            <div class="section-title">Temel</div>
            <div class="form-group"><label>Maaş</label><input type="number" id="salary-2" value="" oninput="calculate(2)" placeholder="0"></div>
            <div class="form-group"><label>Nakit</label><input type="number" id="cash-2" value="" oninput="calculate(2)" placeholder="0"></div>
            <div class="form-group"><label>Borç</label><input type="number" id="card-debt-2" value="" oninput="calculate(2)" placeholder="0"></div>

            <div class="section-title" style="color: var(--danger);">Giderler</div>
            <div id="fixed-expenses-list-2"></div>
            <button class="btn-add" onclick="addRow('fixed-expenses-list-2', 'expense', 2)">+ Ekle</button>

            <div class="section-title" style="color: var(--danger);">Taksitler</div>
            <div id="installments-list-2"></div>
            <button class="btn-add" onclick="addRow('installments-list-2', 'expense', 2)">+ Ekle</button>

            <div class="section-title" style="color: var(--success);">Gelirler</div>
            <div id="extra-income-list-2"></div>
            <button class="btn-add" onclick="addRow('extra-income-list-2', 'income', 2)">+ Ekle</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        const monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
        
        let currentMode = 'home'; // home, current, past
        let selectedMonth = null; // For past month selection
        let selectedYear = null;

        function updateTodayDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('tr-TR', options);
            document.getElementById('today-date').textContent = `Bugün: ${dateStr}`;
        }

        function getMonthData(month, year) {
            // month: 0-11
            const d1 = new Date(year, month, 1);
            const d8 = new Date(year, month, 8);
            const lastDay = new Date(year, month + 1, 0).getDate();
            const d31 = new Date(year, month, lastDay);

            const daysInPeriod1 = 7;
            const daysInPeriod2 = lastDay - 7;

            return {
                month1: monthNames[month],
                month2: monthNames[(month + 1) % 12],
                year: year,
                daysInPeriod1,
                daysInPeriod2
            };
        }

        function getStorageKey(month, year, period) {
            return `hmc_${month}_${year}_period_${period}`;
        }

        function showCurrentPeriod() {
            currentMode = 'current';
            selectedMonth = null;
            
            const today = new Date();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();
            
            const data = getMonthData(currentMonth, currentYear);
            
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('month-selector').classList.remove('active');
            document.getElementById('header').style.display = 'block';
            document.getElementById('container').classList.add('active');
            document.getElementById('back-home-btn').style.display = 'block';
            
            document.getElementById('current-months').textContent = `${data.month1} + ${data.month2}`;
            document.getElementById('period-1-title').textContent = data.month1;
            document.getElementById('period-2-title').textContent = data.month2;
            
            loadData(currentMonth, currentYear);
            calculate(1);
            calculate(2);
            
            // Kaydırma göstergesi
            const container = document.getElementById('container');
            container.addEventListener('scroll', () => {
                const scrollPosition = container.scrollLeft;
                const containerWidth = container.offsetWidth;
                const currentPeriod = Math.round(scrollPosition / containerWidth) + 1;
                
                document.getElementById('dot-1').classList.toggle('active', currentPeriod === 1);
                document.getElementById('dot-2').classList.toggle('active', currentPeriod === 2);
            });
        }

        function showPastMonths() {
            currentMode = 'past';
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('month-selector').classList.add('active');
            document.getElementById('container').classList.remove('active');
            document.getElementById('header').style.display = 'none';
            document.getElementById('back-home-btn').style.display = 'none';
            
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            
            let html = '';
            
            // Son 24 ay göster
            for (let i = 23; i >= 0; i--) {
                const date = new Date(currentYear, currentMonth - i, 1);
                const month = date.getMonth();
                const year = date.getFullYear();
                const monthName = monthNames[month];
                
                html += `<button class="month-btn" onclick="selectMonth(${month}, ${year})">${monthName} ${year}</button>`;
            }
            
            document.getElementById('month-grid').innerHTML = html;
        }

        function selectMonth(month, year) {
            selectedMonth = month;
            selectedYear = year;
            currentMode = 'past-detail';
            
            const data = getMonthData(month, year);
            
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('month-selector').classList.remove('active');
            document.getElementById('header').style.display = 'block';
            document.getElementById('container').classList.add('active');
            document.getElementById('back-home-btn').style.display = 'block';
            
            document.getElementById('current-months').textContent = `${data.month1} + ${data.month2}`;
            document.getElementById('period-1-title').textContent = data.month1;
            document.getElementById('period-2-title').textContent = data.month2;
            
            loadData(month, year);
            calculate(1);
            calculate(2);
        }

        function goHome() {
            currentMode = 'home';
            selectedMonth = null;
            
            document.getElementById('home-screen').classList.add('active');
            document.getElementById('month-selector').classList.remove('active');
            document.getElementById('container').classList.remove('active');
            document.getElementById('header').style.display = 'none';
            document.getElementById('back-home-btn').style.display = 'none';
        }

        function getDaysLeftInPeriod(period, month, year) {
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();
            
            const isCurrentMonth = month === currentMonth && year === currentYear;
            
            if (period === 1) {
                if (!isCurrentMonth || currentDay <= 7) {
                    return 7 - Math.max(currentDay - 1, 0);
                }
                return 0;
            } else {
                const lastDay = new Date(year, month + 1, 0).getDate();
                if (!isCurrentMonth || currentDay >= 8) {
                    return lastDay - 7;
                }
                return lastDay - Math.max(currentDay - 1, 7);
            }
        }

        function addRow(containerId, type = 'expense', period = 1) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `dynamic-row ${type}`;
            div.innerHTML = `
                <input type="text" placeholder="Açıkla" value="" class="row-name" oninput="calculate(${period})">
                <input type="number" placeholder="₺" value="" min="0" step="0.01" class="row-val" oninput="calculate(${period})">
                <button class="btn-del" onclick="this.parentElement.remove(); calculate(${period});">✕</button>
            `;
            container.appendChild(div);
            calculate(period);
        }

        function getListTotal(containerId) {
            let total = 0;
            document.querySelectorAll(`#${containerId} .row-val`).forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            return total;
        }

        function getListData(containerId) {
            const data = [];
            document.querySelectorAll(`#${containerId} .dynamic-row`).forEach(row => {
                const name = row.querySelector('.row-name').value.trim();
                const val = row.querySelector('.row-val').value.trim();
                if (name && val) {
                    data.push({ name, val });
                }
            });
            return data;
        }

        function saveData() {
            if (!selectedMonth && currentMode === 'current') {
                const today = new Date();
                selectedMonth = today.getMonth();
                selectedYear = today.getFullYear();
            }

            if (selectedMonth === null || selectedYear === null) return;

            for (let period = 1; period <= 2; period++) {
                const key = getStorageKey(selectedMonth, selectedYear, period);
                const state = {
                    salary: document.getElementById(`salary-${period}`).value || '',
                    cash: document.getElementById(`cash-${period}`).value || '',
                    cardDebt: document.getElementById(`card-debt-${period}`).value || '',
                    fixedExpenses: getListData(`fixed-expenses-list-${period}`),
                    installments: getListData(`installments-list-${period}`),
                    extraIncome: getListData(`extra-income-list-${period}`)
                };
                localStorage.setItem(key, JSON.stringify(state));
            }
        }

        function loadData(month, year) {
            selectedMonth = month;
            selectedYear = year;

            // Temizle
            for (let period = 1; period <= 2; period++) {
                document.getElementById(`salary-${period}`).value = '';
                document.getElementById(`cash-${period}`).value = '';
                document.getElementById(`card-debt-${period}`).value = '';
                document.getElementById(`fixed-expenses-list-${period}`).innerHTML = '';
                document.getElementById(`installments-list-${period}`).innerHTML = '';
                document.getElementById(`extra-income-list-${period}`).innerHTML = '';
            }

            // Yükle
            for (let period = 1; period <= 2; period++) {
                const key = getStorageKey(month, year, period);
                const saved = localStorage.getItem(key);
                
                if (!saved) continue;
                
                const state = JSON.parse(saved);
                
                document.getElementById(`salary-${period}`).value = state.salary || '';
                document.getElementById(`cash-${period}`).value = state.cash || '';
                document.getElementById(`card-debt-${period}`).value = state.cardDebt || '';
                
                if (state.fixedExpenses) {
                    state.fixedExpenses.forEach(item => {
                        const container = document.getElementById(`fixed-expenses-list-${period}`);
                        const div = document.createElement('div');
                        div.className = 'dynamic-row expense';
                        div.innerHTML = `
                            <input type="text" placeholder="Açıkla" value="${item.name}" class="row-name" oninput="calculate(${period})">
                            <input type="number" placeholder="₺" value="${item.val}" min="0" step="0.01" class="row-val" oninput="calculate(${period})">
                            <button class="btn-del" onclick="this.parentElement.remove(); calculate(${period});">✕</button>
                        `;
                        container.appendChild(div);
                    });
                }
                
                if (state.installments) {
                    state.installments.forEach(item => {
                        const container = document.getElementById(`installments-list-${period}`);
                        const div = document.createElement('div');
                        div.className = 'dynamic-row expense';
                        div.innerHTML = `
                            <input type="text" placeholder="Açıkla" value="${item.name}" class="row-name" oninput="calculate(${period})">
                            <input type="number" placeholder="₺" value="${item.val}" min="0" step="0.01" class="row-val" oninput="calculate(${period})">
                            <button class="btn-del" onclick="this.parentElement.remove(); calculate(${period});">✕</button>
                        `;
                        container.appendChild(div);
                    });
                }
                
                if (state.extraIncome) {
                    state.extraIncome.forEach(item => {
                        const container = document.getElementById(`extra-income-list-${period}`);
                        const div = document.createElement('div');
                        div.className = 'dynamic-row income';
                        div.innerHTML = `
                            <input type="text" placeholder="Açıkla" value="${item.name}" class="row-name" oninput="calculate(${period})">
                            <input type="number" placeholder="₺" value="${item.val}" min="0" step="0.01" class="row-val" oninput="calculate(${period})">
                            <button class="btn-del" onclick="this.parentElement.remove(); calculate(${period});">✕</button>
                        `;
                        container.appendChild(div);
                    });
                }
            }
        }

        function calculate(period) {
            const salary = parseFloat(document.getElementById(`salary-${period}`).value) || 0;
            const cash = parseFloat(document.getElementById(`cash-${period}`).value) || 0;
            const cardDebt = parseFloat(document.getElementById(`card-debt-${period}`).value) || 0;

            const fixedExpenses = getListTotal(`fixed-expenses-list-${period}`);
            const installments = getListTotal(`installments-list-${period}`);
            const extraIncome = getListTotal(`extra-income-list-${period}`);

            const netExExtra = salary + cash - fixedExpenses - installments - cardDebt;
            const netIncExtra = netExExtra + extraIncome;

            const daysLeft = selectedMonth !== null ? getDaysLeftInPeriod(period, selectedMonth, selectedYear) : 0;
            const dailyLimit = daysLeft > 0 ? netIncExtra / daysLeft : 0;

            document.getElementById(`net-ex-extra-${period}`).textContent = `₺${netExExtra.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById(`net-inc-extra-${period}`).textContent = `₺${netIncExtra.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById(`daily-limit-${period}`).textContent = `₺${dailyLimit.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById(`days-left-${period}`).textContent = `Kalan: ${daysLeft} gün`;

            saveData();
        }

        updateTodayDate();
    </script>
</body>
</html>
