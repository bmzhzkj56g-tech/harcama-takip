<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .screen { display: none; }
        .screen.active { display: flex; }

        /* HOME */
        #home {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
        }

        .home-title { font-size: 2rem; font-weight: bold; letter-spacing: 2px; }

        .home-date { font-size: 0.9rem; color: #888; }

        .btn {
            padding: 15px 30px;
            background: #1a1a1a;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 90%;
            max-width: 300px;
        }

        .btn:active { background: #fff; color: #000; }

        /* MONTH SELECT */
        #months {
            flex-direction: column;
            padding: 20px;
            gap: 10px;
            height: 100vh;
            overflow-y: auto;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex: 1;
        }

        .month-btn {
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .month-btn:active { background: #fff; color: #000; }

        /* PERIOD */
        #period {
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            overflow-y: auto;
            padding-top: 50px;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #000;
            padding: 10px;
            border-bottom: 1px solid #333;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-size: 1.2rem; font-weight: bold; }

        .back-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .back-btn:active { background: #fff; color: #000; }

        .period-title { font-size: 1.1rem; font-weight: bold; margin: 10px 0; text-align: center; }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background: #111;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #fff;
        }

        .dash-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .dash-label { font-size: 0.75rem; color: #888; font-weight: 600; margin-bottom: 4px; }

        .dash-value { font-size: 1.3rem; font-weight: 700; }

        .dash-daily { font-size: 0.7rem; color: #888; margin-top: 4px; }

        .section-title {
            font-size: 0.85rem;
            color: #888;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .input-group label { 
            min-width: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 1rem;
        }

        .list-header {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #ff4444;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            margin-bottom: 6px;
            user-select: none;
        }

        .list-header.income { border-left-color: #ffdd00; }

        .list-header-label { font-size: 0.85rem; font-weight: 600; }

        .list-header-value { font-size: 1rem; font-weight: 700; }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
            background: #0a0a0a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .list-container.hidden { display: none; }

        .list-item {
            display: flex;
            gap: 6px;
            background: #1a1a1a;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #333;
            align-items: center;
        }

        .list-item input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .list-item input[type="text"] { flex: 1; min-width: 100px; }
        .list-item input[type="number"] { width: 60px; }

        .delete-btn {
            background: #ff4444;
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .delete-btn:active { opacity: 0.8; }

        .add-btn {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid #555;
            color: #888;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .add-btn:active { background: #1a1a1a; }
    </style>
</head>
<body>

<!-- HOME SCREEN -->
<div class="screen active" id="home">
    <div class="home-title">HMC</div>
    <div class="home-date" id="home-date">Bugün: --</div>
    <button class="btn" onclick="showCurrent()">Mevcut Dönem</button>
    <button class="btn" onclick="showMonths()">Geçmiş Dönem</button>
</div>

<!-- MONTH SELECT SCREEN -->
<div class="screen" id="months">
    <div style="text-align: center; padding: 10px; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">Ay Seçin</div>
    <div class="month-grid" id="month-grid"></div>
    <button class="btn" onclick="goHome()" style="margin-top: 10px;">← Geri Dön</button>
</div>

<!-- PERIOD SCREEN -->
<div class="screen" id="period">
    <div class="header">
        <div class="header-title" id="period-header">--</div>
        <button class="back-btn" onclick="goHome()">← Ana</button>
    </div>

    <div style="margin-top: 40px;">
        <div class="period-title" id="period-name">--</div>

        <div class="dashboard">
            <div class="dash-item">
                <div class="dash-label">Kalan -</div>
                <div class="dash-value" id="calc-ex">₺0,00</div>
                <div class="dash-daily" id="daily-ex">Günlük: ₺0,00</div>
            </div>
            <div class="dash-item">
                <div class="dash-label">Kalan +</div>
                <div class="dash-value" style="color: #ffdd00;" id="calc-inc">₺0,00</div>
                <div class="dash-daily" id="daily-inc">Günlük: ₺0,00</div>
            </div>
            <div class="dash-item">
                <div class="dash-label">Kalan ++</div>
                <div class="dash-value" style="color: #ffdd00;" id="calc-bonus">₺0,00</div>
                <div class="dash-daily" id="daily-bonus">Günlük: ₺0,00</div>
            </div>
        </div>

        <div class="section-title">Temel</div>
        <div class="input-group">
            <label>Maaş</label>
            <input type="number" id="input-salary" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Nakit</label>
            <input type="number" id="input-cash" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Borç</label>
            <input type="number" id="input-debt" placeholder="0" oninput="calculate()">
        </div>

        <div class="section-title">Giderler</div>
        <div class="list-header" onclick="toggleList('expenses')">
            <div class="list-header-label">Giderler</div>
            <div class="list-header-value" id="total-expenses">₺0,00</div>
        </div>
        <div class="list-container hidden" id="expenses"></div>
        <button class="add-btn" onclick="addItem('expenses')">+ Ekle</button>

        <div class="section-title">Taksitler</div>
        <div class="list-header" onclick="toggleList('installments')">
            <div class="list-header-label">Taksitler</div>
            <div class="list-header-value" id="total-installments">₺0,00</div>
        </div>
        <div class="list-container hidden" id="installments"></div>
        <button class="add-btn" onclick="addItem('installments')">+ Ekle</button>

        <div class="section-title">Gelirler</div>
        <div class="list-header income" onclick="toggleList('income')">
            <div class="list-header-label">Gelirler</div>
            <div class="list-header-value" id="total-income">₺0,00</div>
        </div>
        <div class="list-container hidden" id="income"></div>
        <button class="add-btn" onclick="addItem('income')">+ Ekle</button>

        <div class="section-title">Bonus</div>
        <div class="list-header income" onclick="toggleList('bonus')">
            <div class="list-header-label">Bonus</div>
            <div class="list-header-value" id="total-bonus">₺0,00</div>
        </div>
        <div class="list-container hidden" id="bonus"></div>
        <button class="add-btn" onclick="addItem('bonus')">+ Ekle</button>
    </div>
</div>

<script>
    const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
    let curMonth = null;
    let curYear = null;
    let curPeriod = null;

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function updateDate() {
        const d = new Date();
        const opt = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('home-date').textContent = `Bugün: ${d.toLocaleDateString('tr-TR', opt)}`;
    }

    function goHome() {
        show('home');
        curMonth = null;
        curYear = null;
        curPeriod = null;
    }

    function showCurrent() {
        const d = new Date();
        curMonth = d.getMonth();
        curYear = d.getFullYear();
        loadPeriod(1);
    }

    function showMonths() {
        show('months');
        let html = '';
        for (let y = 2026; y <= new Date().getFullYear(); y++) {
            const end = (y === new Date().getFullYear()) ? new Date().getMonth() : 11;
            for (let m = end; m >= 0; m--) {
                html += `<button class="month-btn" onclick="selectMonth(${m}, ${y})">${months[m]} ${y}</button>`;
            }
        }
        document.getElementById('month-grid').innerHTML = html;
    }

    function selectMonth(m, y) {
        curMonth = m;
        curYear = y;
        loadPeriod(1);
    }

    function loadPeriod(p) {
        curPeriod = p;
        show('period');
        
        const nextM = (curMonth + 1) % 12;
        const name = `${months[curMonth]} (1-7) + ${months[nextM]} (8-${new Date(curYear, curMonth + 1, 0).getDate()})`;
        document.getElementById('period-header').textContent = name;
        document.getElementById('period-name').textContent = p === 1 ? months[curMonth] : months[nextM];

        clearForm();
        loadData();
        calculate();
    }

    function getStorageKey() {
        return `hmc_${curMonth}_${curYear}_${curPeriod}`;
    }

    function clearForm() {
        document.getElementById('input-salary').value = '';
        document.getElementById('input-cash').value = '';
        document.getElementById('input-debt').value = '';
        ['expenses', 'installments', 'income', 'bonus'].forEach(id => {
            document.getElementById(id).innerHTML = '';
        });
    }

    function loadData() {
        const key = getStorageKey();
        const data = JSON.parse(localStorage.getItem(key) || '{}');
        
        document.getElementById('input-salary').value = data.salary || '';
        document.getElementById('input-cash').value = data.cash || '';
        document.getElementById('input-debt').value = data.debt || '';

        ['expenses', 'installments', 'income', 'bonus'].forEach(type => {
            if (data[type]) {
                data[type].forEach(item => addItem(type, item.name, item.val));
            }
        });
    }

    function saveData() {
        const key = getStorageKey();
        const obj = {
            salary: document.getElementById('input-salary').value || '',
            cash: document.getElementById('input-cash').value || '',
            debt: document.getElementById('input-debt').value || ''
        };

        ['expenses', 'installments', 'income', 'bonus'].forEach(type => {
            obj[type] = [];
            document.querySelectorAll(`#${type} .list-item`).forEach(item => {
                const name = item.querySelector('input[type="text"]').value.trim();
                const val = item.querySelector('input[type="number"]').value.trim();
                if (name && val) obj[type].push({name, val});
            });
        });

        localStorage.setItem(key, JSON.stringify(obj));
    }

    function addItem(type, name = '', val = '') {
        const cont = document.getElementById(type);
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <input type="text" value="${name}" placeholder="Açıkla" class="item-name" oninput="calculate()">
            <input type="number" value="${val}" placeholder="0" class="item-val" min="0" step="0.01" oninput="calculate()">
            <button class="delete-btn" onclick="this.parentElement.remove(); calculate();">✕</button>
        `;
        cont.appendChild(div);
        calculate();
    }

    function toggleList(type) {
        const cont = document.getElementById(type);
        cont.classList.toggle('hidden');
    }

    function getTotal(type) {
        let sum = 0;
        document.querySelectorAll(`#${type} .item-val`).forEach(inp => {
            sum += parseFloat(inp.value) || 0;
        });
        return sum;
    }

    function getDaysLeft() {
        const d = new Date();
        const day = d.getDate();
        const m = d.getMonth();
        const y = d.getFullYear();
        const isCur = (m === curMonth && y === curYear);
        const lastDay = new Date(curYear, curMonth + 1, 0).getDate();

        if (curPeriod === 1) {
            if (isCur && day <= 7) return 8 - day;
            if (!isCur && (m < curMonth || y < curYear)) return 0;
            return 7;
        } else {
            if (isCur && day >= 8) return lastDay - day + 1;
            if (!isCur && (m < curMonth || y < curYear)) return 0;
            return lastDay - 7;
        }
    }

    function calculate() {
        const salary = parseFloat(document.getElementById('input-salary').value) || 0;
        const cash = parseFloat(document.getElementById('input-cash').value) || 0;
        const debt = parseFloat(document.getElementById('input-debt').value) || 0;

        const exp = getTotal('expenses');
        const inst = getTotal('installments');
        const inc = getTotal('income');
        const bon = getTotal('bonus');

        const netEx = salary + cash - exp - inst - debt;
        const netInc = netEx + inc;
        const netBon = netInc + bon;

        const days = getDaysLeft();
        const dailyEx = days > 0 ? netEx / days : 0;
        const dailyInc = days > 0 ? netInc / days : 0;
        const dailyBon = days > 0 ? netBon / days : 0;

        document.getElementById('total-expenses').textContent = `₺${exp.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('total-installments').textContent = `₺${inst.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('total-income').textContent = `₺${inc.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('total-bonus').textContent = `₺${bon.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;

        document.getElementById('calc-ex').textContent = `₺${netEx.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('calc-inc').textContent = `₺${netInc.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('calc-bonus').textContent = `₺${netBon.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;

        document.getElementById('daily-ex').textContent = `Günlük: ₺${dailyEx.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('daily-inc').textContent = `Günlük: ₺${dailyInc.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('daily-bonus').textContent = `Günlük: ₺${dailyBon.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;

        saveData();
    }

    updateDate();
</script>

</body>
</html>
