<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HMC">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23ffffff' width='192' height='192'/><text x='50%' y='50%' font-size='100' fill='black' text-anchor='middle' dominant-baseline='middle'>₺</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23ffffff' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='90' fill='black' text-anchor='middle' dominant-baseline='middle'>₺</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>HMC</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1a1a1a;
            --text: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --danger: #ff4444;
            --success: #ffdd00;
            --border: #333333;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { width: 100%; height: 100%; -webkit-user-select: none; user-select: none; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            padding: 0;
            margin: 0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            padding: 12px 12px 8px 12px;
            padding-top: max(12px, var(--safe-top));
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }

        .header h1 { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--accent); 
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .today { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
        }

        .period-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.7rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .dot.active { background: var(--accent); }

        .container {
            display: flex;
            width: 100%;
            height: calc(100vh - var(--safe-top) - var(--safe-bottom));
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .period {
            flex: 0 0 100%;
            width: 100%;
            overflow-y: auto;
            scroll-snap-align: start;
            padding: 12px;
            padding-bottom: max(12px, var(--safe-bottom));
        }

        .period-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dash-card {
            background: var(--card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            word-break: break-word;
        }

        .dash-card.full { 
            grid-column: span 2; 
            background: #222222;
            border: 2px solid var(--accent);
        }
        .dash-card label { font-size: 0.65rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .dash-card .value { font-size: 1.2rem; font-weight: 700; }
        .dash-card.full .value { font-size: 1.5rem; }

        .section-title { 
            font-size: 0.75rem; 
            font-weight: 700; 
            margin: 12px 0 6px 0; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .form-group {
            background: var(--card);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .form-group label { font-size: 0.85rem; min-width: 30%; font-weight: 600; }
        .form-group input {
            flex: 1;
            min-width: 100px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 6px;
            text-align: right;
            font-size: 1rem;
        }

        .dynamic-row { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 8px;
            background: var(--card);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        .dynamic-row.expense {
            border-left: 3px solid var(--danger);
        }

        .dynamic-row.income {
            border-left: 3px solid var(--success);
        }

        .dynamic-row input[type="text"] { 
            flex: 1;
            min-width: 80px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .dynamic-row input[type="number"] { 
            width: 70px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            text-align: right;
            font-size: 0.9rem;
        }

        .btn-del { 
            background: var(--danger); 
            border: none; 
            color: white; 
            border-radius: 6px; 
            padding: 6px 8px; 
            font-weight: bold; 
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .btn-add {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 8px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-size: 0.9rem;
        }

        .install-banner {
            background: #222222;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 0.8rem;
            display: none;
            border: 1px solid var(--border);
        }
        .install-banner.show { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HMC</h1>
        <div class="today" id="today-date">Bugün: --</div>
        <div class="period-indicator">
            <div class="dot active" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
        </div>
    </div>

    <div class="container" id="container">
        
        <!-- DÖNEM 1: 1-7 -->
        <div class="period" id="period-1">
            <div class="install-banner" id="install-banner">
                📱 Ana ekrana ekle: Safari Paylaş → Ekle
            </div>

            <div class="period-title">Dönem 1: 1-7 (Maaş Gelişi)</div>

            <!-- Özet Paneli -->
            <div class="dashboard">
                <div class="dash-card full">
                    <label>Günlük Limit</label>
                    <div class="value" id="daily-limit-1">₺0,00</div>
                    <small style="font-size: 0.65rem; opacity: 0.8;" id="days-left-1">Kalan: 0 gün</small>
                </div>
                <div class="dash-card">
                    <label>Kalan (-)</label>
                    <div class="value" id="net-ex-extra-1">₺0,00</div>
                </div>
                <div class="dash-card">
                    <label>Kalan (+)</label>
                    <div class="value" style="color: var(--success)" id="net-inc-extra-1">₺0,00</div>
                </div>
            </div>

            <!-- Sabit Bütçe Kalemleri -->
            <div class="section-title">Temel</div>
            <div class="form-group"><label>Maaş</label><input type="number" id="salary-1" value="" oninput="calculate(1)" placeholder="0"></div>
            <div class="form-group"><label>Nakit</label><input type="number" id="cash-1" value="" oninput="calculate(1)" placeholder="0"></div>
            <div class="form-group"><label>Borç</label><input type="number" id="card-debt-1" value="" oninput="calculate(1)" placeholder="0"></div>

            <!-- Giderler -->
            <div class="section-title" style="color: var(--danger);">Giderler</div>
            <div id="fixed-expenses-list-1"></div>
            <button class="btn-add" onclick="addRow('fixed-expenses-list-1', 'expense', 1)">+ Ekle</button>

            <div class="section-title" style="color: var(--danger);">Taksitler</div>
            <div id="installments-list-1"></div>
            <button class="btn-add" onclick="addRow('installments-list-1', 'expense', 1)">+ Ekle</button>

            <div class="section-title" style="color: var(--success);">Gelirler</div>
            <div id="extra-income-list-1"></div>
            <button class="btn-add" onclick="addRow('extra-income-list-1', 'income', 1)">+ Ekle</button>
        </div>

        <!-- DÖNEM 2: 8-31 -->
        <div class="period" id="period-2">
            <div class="period-title">Dönem 2: 8-31 (Borç Ödendikten Sonra)</div>

            <!-- Özet Paneli -->
            <div class="dashboard">
                <div class="dash-card full">
                    <label>Günlük Limit</label>
                    <div class="value" id="daily-limit-2">₺0,00</div>
                    <small style="font-size: 0.65rem; opacity: 0.8;" id="days-left-2">Kalan: 0 gün</small>
                </div>
                <div class="dash-card">
                    <label>Kalan (-)</label>
                    <div class="value" id="net-ex-extra-2">₺0,00</div>
                </div>
                <div class="dash-card">
                    <label>Kalan (+)</label>
                    <div class="value" style="color: var(--success)" id="net-inc-extra-2">₺0,00</div>
                </div>
            </div>

            <!-- Sabit Bütçe Kalemleri -->
            <div class="section-title">Temel</div>
            <div class="form-group"><label>Maaş</label><input type="number" id="salary-2" value="" oninput="calculate(2)" placeholder="0"></div>
            <div class="form-group"><label>Nakit</label><input type="number" id="cash-2" value="" oninput="calculate(2)" placeholder="0"></div>
            <div class="form-group"><label>Borç</label><input type="number" id="card-debt-2" value="" oninput="calculate(2)" placeholder="0"></div>

            <!-- Giderler -->
            <div class="section-title" style="color: var(--danger);">Giderler</div>
            <div id="fixed-expenses-list-2"></div>
            <button class="btn-add" onclick="addRow('fixed-expenses-list-2', 'expense', 2)">+ Ekle</button>

            <div class="section-title" style="color: var(--danger);">Taksitler</div>
            <div id="installments-list-2"></div>
            <button class="btn-add" onclick="addRow('installments-list-2', 'expense', 2)">+ Ekle</button>

            <div class="section-title" style="color: var(--success);">Gelirler</div>
            <div id="extra-income-list-2"></div>
            <button class="btn-add" onclick="addRow('extra-income-list-2', 'income', 2)">+ Ekle</button>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').classList.add('show');
        });

        // Bugünün tarihini göster
        function updateTodayDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('tr-TR', options);
            document.getElementById('today-date').textContent = `Bugün: ${dateStr}`;
        }

        // Kaydırma göstergesini güncelle
        const container = document.getElementById('container');
        container.addEventListener('scroll', () => {
            const scrollPosition = container.scrollLeft;
            const containerWidth = container.offsetWidth;
            const currentPeriod = Math.round(scrollPosition / containerWidth) + 1;
            
            document.getElementById('dot-1').classList.toggle('active', currentPeriod === 1);
            document.getElementById('dot-2').classList.toggle('active', currentPeriod === 2);
        });

        function getDaysLeftInPeriod(period) {
            const today = new Date();
            const currentDay = today.getDate();
            
            if (period === 1) {
                // 1-7 arası
                if (currentDay <= 7) {
                    return 8 - currentDay;
                } else {
                    return 0;
                }
            } else {
                // 8-31 arası
                if (currentDay >= 8) {
                    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                    return lastDay - currentDay + 1;
                } else {
                    return 0;
                }
            }
        }

        function addRow(containerId, type = 'expense', period = 1) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `dynamic-row ${type}`;
            div.innerHTML = `
                <input type="text" placeholder="Açıkla" value="" class="row-name" oninput="calculate(${period})">
                <input type="number" placeholder="₺" value="" min="0" step="0.01" class="row-val" oninput="calculate(${period})">
                <button class="btn-del" onclick="this.parentElement.remove(); calculate(${period});">✕</button>
            `;
            container.appendChild(div);
            calculate(period);
        }

        function getListTotal(containerId) {
            let total = 0;
            document.querySelectorAll(`#${containerId} .row-val`).forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            return total;
        }

        function getListData(containerId) {
            const data = [];
            document.querySelectorAll(`#${containerId} .dynamic-row`).forEach(row => {
                const name = row.querySelector('.row-name').value.trim();
                const val = row.querySelector('.row-val').value.trim();
                if (name && val) {
                    data.push({ name, val });
                }
            });
            return data;
        }

        function saveData() {
            const state = {
                period1: {
                    salary: document.getElementById('salary-1').value || '',
                    cash: document.getElementById('cash-1').value || '',
                    cardDebt: document.getElementById('card-debt-1').value || '',
                    fixedExpenses: getListData('fixed-expenses-list-1'),
                    installments: getListData('installments-list-1'),
                    extraIncome: getListData('extra-income-list-1')
                },
                period2: {
                    salary: document.getElementById('salary-2').value || '',
                    cash: document.getElementById('cash-2').value || '',
                    cardDebt: document.getElementById('card-debt-2').value || '',
                    fixedExpenses: getListData('fixed-expenses-list-2'),
                    installments: getListData('installments-list-2'),
                    extraIncome: getListData('extra-income-list-2')
                }
            };
            localStorage.setItem('hmc_data', JSON.stringify(state));
        }

        function loadData() {
            const saved = localStorage.getItem('hmc_data');
            if (!saved) return;

            const state = JSON.parse(saved);

            // Dönem 1
            if (state.period1) {
                document.getElementById('salary-1').value = state.period1.salary || '';
                document.getElementById('cash-1').value = state.period1.cash || '';
                document.getElementById('card-debt-1').value = state.period1.cardDebt || '';
                if (state.period1.fixedExpenses) {
                    state.period1.fixedExpenses.forEach(item => addRow('fixed-expenses-list-1', 'expense', 1));
                }
                if (state.period1.installments) {
                    state.period1.installments.forEach(item => addRow('installments-list-1', 'expense', 1));
                }
                if (state.period1.extraIncome) {
                    state.period1.extraIncome.forEach(item => addRow('extra-income-list-1', 'income', 1));
                }
            }

            // Dönem 2
            if (state.period2) {
                document.getElementById('salary-2').value = state.period2.salary || '';
                document.getElementById('cash-2').value = state.period2.cash || '';
                document.getElementById('card-debt-2').value = state.period2.cardDebt || '';
                if (state.period2.fixedExpenses) {
                    state.period2.fixedExpenses.forEach(item => addRow('fixed-expenses-list-2', 'expense', 2));
                }
                if (state.period2.installments) {
                    state.period2.installments.forEach(item => addRow('installments-list-2', 'expense', 2));
                }
                if (state.period2.extraIncome) {
                    state.period2.extraIncome.forEach(item => addRow('extra-income-list-2', 'income', 2));
                }
            }
        }

        function calculate(period) {
            const salary = parseFloat(document.getElementById(`salary-${period}`).value) || 0;
            const cash = parseFloat(document.getElementById(`cash-${period}`).value) || 0;
            const cardDebt = parseFloat(document.getElementById(`card-debt-${period}`).value) || 0;

            const fixedExpenses = getListTotal(`fixed-expenses-list-${period}`);
            const installments = getListTotal(`installments-list-${period}`);
            const extraIncome = getListTotal(`extra-income-list-${period}`);

            const netExExtra = salary + cash - fixedExpenses - installments - cardDebt;
            const netIncExtra = netExExtra + extraIncome;

            const daysLeft = getDaysLeftInPeriod(period);
            const dailyLimit = daysLeft > 0 ? netIncExtra / daysLeft : 0;

            document.getElementById(`net-ex-extra-${period}`).textContent = `₺${netExExtra.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById(`net-inc-extra-${period}`).textContent = `₺${netIncExtra.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById(`daily-limit-${period}`).textContent = `₺${dailyLimit.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
            document.getElementById(`days-left-${period}`).textContent = `Kalan: ${daysLeft} gün`;

            saveData();
        }

        updateTodayDate();
        loadData();
        calculate(1);
        calculate(2);
    </script>
</body>
</html>
